[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fcatbot"
dynamic = ["version"]
description = "Fcatbot —— 一个可插拔、多平台的聊天机器人框架。"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Fish-LP", email = "Fish.zh@outlook.com" },
]
maintainers = [
    { name = "Fish-LP", email = "Fish.zh@outlook.com" },
]
keywords = [
    "qqbot", "bot", "framework", "plugin",
    "qq", "onebot", "adapter", "async",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]
dependencies = [
    "pluginforge>=0.10.0",
    "luckperms-python>=1.0.6",
    "aiohttp>=3.9",
    "prompt-toolkit>=3.0",
    "pyyaml>=6.0",
    "packaging>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.scripts]
fcatbot = "fcatbot.app:main"
fcatbot-new-plugin = "fcatbot.tools.new_plugin:main"

[project.urls]
Homepage = "https://github.com/Fish-LP/fcatbot"
Repository = "https://github.com/Fish-LP/fcatbot"
Issues = "https://github.com/Fish-LP/fcatbot/issues"
Changelog = "https://github.com/Fish-LP/fcatbot/blob/main/CHANGELOG.md"
Documentation = "https://fcatbot.readthedocs.io/"

[tool.hatch.version]
path = "src/fcatbot/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fcatbot"]

[tool.hatch.build.targets.sdist]
include = [
    "src/fcatbot",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
